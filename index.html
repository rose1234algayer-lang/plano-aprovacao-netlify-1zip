          var saveCity = function(city, region) {
            if (!city || typeof city !== "string") return;
            var loc = region ? (city + ", " + region) : city;
            window.__GEO_CITY = city;
            window.__GEO_LOCATION = loc;

              localStorage.setItem("geo_city", city);

          fetch("https://ipwho.is/")
            .then(function(r) { return r.json(); })
            .then(function(d) {
              if (d && d.success && d.city) {
                var reg = d.region_code || d.region || "";
                saveCity(d.city, reg);
              } else throw new Error();
            })
            .catch(function() {
              fetch("https://get.geojs.io/v1/ip/geo.json")

                .catch(function() {});
            });
        } catch(e) {}
      })();
